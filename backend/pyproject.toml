[project]
name = "it-support-agent-backend"
version = "0.1.0"
description = "Backend foundation for the IT Support Agent Platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "celery[redis]>=5.6,<6",
    "fastapi>=0.116,<1",
    "langgraph>=1,<2",
    "langgraph-checkpoint-postgres>=3,<4",
    "mcp>=2,<3",
    "openai>=1.100,<3",
    "pydantic-settings>=2.10,<3",
    "psycopg[binary,pool]>=3.2,<4",
    "pwdlib[argon2]>=0.3,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.35,<1",
    "pypdf>=6.18,<7",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "jsonschema>=4.25,<5",
    "mypy>=1.17,<2",
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
]

[tool.uv]
package = true
required-version = ">=0.11,<0.12"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
