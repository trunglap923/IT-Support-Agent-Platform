name: it-support-agent-platform

x-backend-image: &backend-image
  image: it-support-agent-api:local
  init: true
  restart: unless-stopped

x-backend-environment: &backend-environment
  APP_ENV: development
  DEMO_MODE: "true"
  AI_PROVIDER: ${AI_PROVIDER:-fake}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini-2025-04-14}
  OPENAI_INPUT_PRICE_PER_MILLION_USD: ${OPENAI_INPUT_PRICE_PER_MILLION_USD:-0.40}
  OPENAI_OUTPUT_PRICE_PER_MILLION_USD: ${OPENAI_OUTPUT_PRICE_PER_MILLION_USD:-1.60}
  OPENAI_PRICE_VERSION: ${OPENAI_PRICE_VERSION:-2026-09-openai-published}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
  EMBEDDING_INPUT_PRICE_PER_MILLION_USD: ${EMBEDDING_INPUT_PRICE_PER_MILLION_USD:-0.02}
  EMBEDDING_PRICE_VERSION: ${EMBEDDING_PRICE_VERSION:-2026-09-plan-v1}
  APP_AI_DAILY_BUDGET_USD: ${APP_AI_DAILY_BUDGET_USD:-1}
  APP_AI_MONTHLY_BUDGET_USD: ${APP_AI_MONTHLY_BUDGET_USD:-10}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-it_support_agent}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-it_support_agent}
  REDIS_URL: redis://redis:6379/0
  READINESS_TIMEOUT_SECONDS: ${READINESS_TIMEOUT_SECONDS:-2}
  DOCUMENT_STORAGE_PATH: /app/.storage/documents
  DOCUMENT_MAX_PDF_BYTES: ${DOCUMENT_MAX_PDF_BYTES:-10485760}
  DOCUMENT_MAX_PDF_PAGES: ${DOCUMENT_MAX_PDF_PAGES:-100}
  DOCUMENT_MAX_EXTRACTED_TEXT_BYTES: ${DOCUMENT_MAX_EXTRACTED_TEXT_BYTES:-1048576}
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
  LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
  LOG_PROMPTS: "false"
  CELERY_TASK_SOFT_TIME_LIMIT_SECONDS: ${CELERY_TASK_SOFT_TIME_LIMIT_SECONDS:-300}
  CELERY_TASK_TIME_LIMIT_SECONDS: ${CELERY_TASK_TIME_LIMIT_SECONDS:-330}
  RUN_LEASE_SECONDS: ${RUN_LEASE_SECONDS:-90}
  RUN_MAX_ATTEMPTS: ${RUN_MAX_ATTEMPTS:-3}

x-datastore-dependencies: &datastore-dependencies
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  frontend:
    image: it-support-agent-web:local
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edge
      - backend
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /var/cache/nginx:rw,noexec,nosuid,size=16m
      - /var/run:rw,noexec,nosuid,size=4m

  api:
    <<: *backend-image
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      <<: *backend-environment
      DEMO_SEED_PASSWORD: ${DEMO_SEED_PASSWORD:-}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-8}
      AUTH_LOGIN_RATE_LIMIT_ENABLED: ${AUTH_LOGIN_RATE_LIMIT_ENABLED:-true}
      AUTH_LOGIN_MAX_ATTEMPTS: ${AUTH_LOGIN_MAX_ATTEMPTS:-5}
      AUTH_LOGIN_WINDOW_SECONDS: ${AUTH_LOGIN_WINDOW_SECONDS:-300}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-it_support_session}
      CSRF_COOKIE_NAME: ${CSRF_COOKIE_NAME:-it_support_csrf}
      COOKIE_SECURE: "false"
      ALLOWED_WEB_ORIGIN: http://127.0.0.1:${FRONTEND_PORT:-5173}
      SSE_POLL_INTERVAL_SECONDS: ${SSE_POLL_INTERVAL_SECONDS:-1}
      SSE_HEARTBEAT_SECONDS: ${SSE_HEARTBEAT_SECONDS:-15}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - document_storage:/app/.storage
    depends_on: *datastore-dependencies
    networks:
      - edge
      - backend
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=2).read()"
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 6

  worker-agent:
    <<: *backend-image
    hostname: worker-agent
    command:
      - celery
      - -A
      - app.jobs.celery_app:celery_app
      - worker
      - --queues
      - agent
      - --concurrency
      - ${CELERY_AGENT_CONCURRENCY:-2}
      - --hostname
      - agent@worker-agent
      - --loglevel
      - INFO
    environment: *backend-environment
    volumes:
      - document_storage:/app/.storage
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test:
        - CMD
        - celery
        - -A
        - app.jobs.celery_app:celery_app
        - inspect
        - ping
        - --destination
        - agent@worker-agent
        - --timeout
        - "3"
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5

  worker-background:
    <<: *backend-image
    hostname: worker-background
    command:
      - celery
      - -A
      - app.jobs.celery_app:celery_app
      - worker
      - --queues
      - background
      - --concurrency
      - ${CELERY_BACKGROUND_CONCURRENCY:-1}
      - --hostname
      - background@worker-background
      - --loglevel
      - INFO
    environment: *backend-environment
    volumes:
      - document_storage:/app/.storage
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test:
        - CMD
        - celery
        - -A
        - app.jobs.celery_app:celery_app
        - inspect
        - ping
        - --destination
        - background@worker-background
        - --timeout
        - "3"
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5

  scheduler:
    <<: *backend-image
    command:
      - celery
      - -A
      - app.jobs.celery_app:celery_app
      - beat
      - --loglevel
      - INFO
      - --pidfile
      - /tmp/celerybeat.pid
      - --schedule
      - /tmp/celerybeat-schedule
    environment: *backend-environment
    depends_on:
      worker-background:
        condition: service_healthy
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    healthcheck:
      test:
        - CMD-SHELL
        - "test -s /tmp/celerybeat.pid && kill -0 $$(cat /tmp/celerybeat.pid)"
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 5

  postgres:
    image: pgvector/pgvector:0.8.2-pg17-bookworm@sha256:feb68f4f15446397d8cac7f4fe48fe4586de83160d1fc48b46283312d1a33966
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-it_support_agent}
      POSTGRES_USER: ${POSTGRES_USER:-it_support_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the local .env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    shm_size: 256mb
    stop_grace_period: 10s
    networks:
      - backend

  redis:
    image: redis:7.4.8-bookworm@sha256:3e0669e42d4fe421c9dea0ba5fbc04d336b80b4f32a6c7d25bee3a1d089288a1
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s
    stop_grace_period: 10s
    networks:
      - backend

volumes:
  postgres_data:
  redis_data:
  document_storage:

networks:
  edge:
  backend:
    internal: true
