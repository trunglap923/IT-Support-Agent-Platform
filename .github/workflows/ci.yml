name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17-bookworm@sha256:feb68f4f15446397d8cac7f4fe48fe4586de83160d1fc48b46283312d1a33966
        env:
          POSTGRES_DB: it_support_agent_test
          POSTGRES_USER: it_support_agent_test
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U it_support_agent_test -d it_support_agent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      AI_PROVIDER: fake
      TEST_DATABASE_ADMIN_URL: postgresql+psycopg://it_support_agent_test:ci-only-password@127.0.0.1:5432/it_support_agent_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked dependencies
        run: uv --system-certs sync --directory backend --python 3.12 --frozen --all-groups
      - name: Check formatting
        run: uv run --directory backend --frozen ruff format --check .
      - name: Lint
        run: uv run --directory backend --frozen ruff check .
      - name: Typecheck
        run: uv run --directory backend --frozen mypy app
      - name: Test
        run: uv run --directory backend --frozen pytest
      - name: Validate evaluation dataset
        run: uv run --project backend --frozen python -m evals.runner.validate_cases

  frontend:
    name: Frontend · Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          package-manager-cache: false
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Test
        working-directory: frontend
        run: npm run test
      - name: Build
        working-directory: frontend
        run: npm run build
